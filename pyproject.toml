[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storra-pre-commit-hooks"
version = "1.1.0"
description = "Storra's pre-commit hooks"
requires-python = ">=3.8"

[project.scripts]
file-token-budget = "storra_pre_commit_hooks.file_token_budget:main"

[tool.setuptools]
packages = ["storra_pre_commit_hooks"]
